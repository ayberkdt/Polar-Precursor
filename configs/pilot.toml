# Pilot experiment (plan 07 "Pilot"; main plan "Dur/devam kapısı").
# Every value here is a pre-registration knob. The numbers are the PROPOSALS of
# plans/07_istatistik_pilot_ve_kapi.md, "Ön kayıt belgesinde sabitlenecek
# kararlar"; the pre-registration document (January 2027) replaces them and the
# config digest recorded in each run manifest shows which version produced a result.

name = "pilot"
description = "30 storms, CHAMP only, 2001-05 .. 2005-12; measures the storm-to-storm SD"
ladder = ["B0", "B1", "B2", "D", "B3", "B3k", "B3t", "B3t2", "M"]

[storms]
period_start = "2001-05-01"
period_end = "2005-12-31"
primary_max_symh_nt = -50.0        # decision 1 (proposal): moderate and stronger in the primary pool
satellites = ["CHAMP"]             # decision 3 (pilot: CHAMP only)
min_symh_coverage = 0.8

[samples]
lead_window_min = [60.0, 270.0]    # decision 4
lead_bin_edges_min = [60.0, 105.0, 150.0, 195.0, 240.0, 270.0]
inputs_low = 4
inputs_polar = 4

[cv]
outer_folds = 10
inner_folds = 5
buffer_h = 57.0                    # longest feature memory
assignment = "round_robin"         # groups sorted by epoch, dealt in turn

[ridge]
alphas = [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]   # decision 10: penalty tuned in the inner loop
standardise = true
impute = "train_mean"

[test]
reference_model = "B3"
candidate_model = "M"
storm_weight = "equal"             # decision 2 (proposal)
bootstrap_resamples = 10000        # decision 7
bootstrap_seed = 20270207
confidence_level = 0.95
permutation_resamples = 1000       # decision 8
permutation_seed = 20270207
permutation_strata = ["intensity", "lead_bin"]
one_sided = true                   # decision 11: H1 one-sided
