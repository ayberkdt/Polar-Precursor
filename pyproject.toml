[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-environment"
version = "0.1.0.dev0"
description = "Solar and geomagnetic activity data for thermosphere and drag studies; designed to be merged into Sidera"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.2,<10", "ruff==0.12.0", "mypy>=1.8,<2", "pandas-stubs", "import-linter>=2.0,<3"]
catalog = ["openpyxl>=3.1"]   # Richardson-Cane xlsx
density = ["cdflib>=1.3"]     # ESA/TU Delft CDF density product
heating = ["h5py>=3.10"]      # Weimer et al. 2023 HDF5 archive
magnetic = ["apexpy>=2.1"]    # quasi-dipole coordinates (source build on Windows, see plans/04)

[tool.setuptools.packages.find]
where = ["src"]

# Lint and typing mirror the Sidera settings so the code can move over unchanged.
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "G004", "SIM105", "SIM114", "SIM910"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
files = ["src/space_environment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_sidera: needs the Sidera package importable (skipped cleanly otherwise)",
    "requires_data: needs a large raw file under data/raw (skipped when absent)",
]

# Layering mirrors the Sidera destination of each package (see plans/12): readers
# (io) sit below the physics conventions and rules, which sit below the analysis
# builders. The Sidera bridge is an application-level consumer like analysis.
# Run: lint-imports
[tool.importlinter]
root_package = "space_environment"

[[tool.importlinter.contracts]]
name = "space_environment packages form one layer stack"
type = "layers"
layers = [
  "space_environment.analysis | space_environment.integration",
  "space_environment.physics",
  "space_environment.io",
  "space_environment.common",
]
