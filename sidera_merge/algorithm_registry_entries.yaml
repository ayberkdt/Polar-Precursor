# Draft registry entries for Sidera's docs/algorithms/algorithm_registry.yaml
# (schema: schemas/algorithm_registry.schema.json, read 2026-10-06).
#
# NOT validated with tools/algorithm_registry.py (that tool lives in Sidera;
# this repository does not run it). Ids use the next free numbers as of
# 2026-10-06 (ATM-005 and MAG entries exist; check again on merge day).
# verification_status values are honest about what was read in this project;
# nothing is marked verified_primary_source unless the defining text was read.
# HEUR entries carry no citation, as the policy allows.

entries:
  - id: SIDERA-ALG-ATM-006
    slug: nrlmsis_index_conventions
    canonical_name: >-
      NRLMSIS driver conventions: previous-day F10.7, centred 81-day mean F10.7,
      and the seven-slot Ap array (daily, current 3-hourly, -3 h, -6 h, -9 h,
      mean of 12-33 h prior, mean of 36-57 h prior)
    category: standard
    domain: ATM
    status: active
    added: "2026-10-06"
    implementation_class: standard_implementation
    verification_status: verified_secondary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - Emmert2021NRLMSIS2
    primary_reference:
      type: article
      citation_key: Emmert2021NRLMSIS2
      identifier_kind: doi
      doi: 10.1029/2020EA001321
      isbn: null
      report_number: null
      standard_number: null
      official_url: https://github.com/SWxTREC/pymsis
      edition: null
      chapter: null
      section: null
      equations: []
      pages: null
      verification_notes: >-
        Slot indexing was read from the installed pymsis 0.13.0 utils.py (the
        wrapper's own index-array construction), not from the NRLMSIS paper;
        hence secondary. Checked on real GFZ rows: the Ap history for
        2003-10-29 07:04 UT, derived by hand from the eight 3-hourly ap values
        of 27-29 October, is (400, 27, 39, 27, 22.0, 13.5) and the code
        reproduces it. With every slot at 4 NRLMSIS 2.1 returned exactly the
        density it gives with its geomagnetic switches off (measured 2026-10-05
        on CHAMP tracks), which fixes the quiet reference definition.
    symbols:
      - path: src/sidera/physics/atmosphere/space_weather.py
        symbol: nrlmsis_ap_history
        role: cpu_implementation
      - path: src/sidera/physics/atmosphere/space_weather.py
        symbol: centred_mean_f107
        role: cpu_implementation
      - path: src/sidera/physics/atmosphere/space_weather.py
        symbol: GfzSpaceWeatherProvider
        role: api_entry_point
    mathematical_contract:
      inputs: GFZ daily Kp/ap/F10.7 table, UTC epoch
      outputs: SpaceWeatherState with f107 (previous day), f107a (centred 81-day), ap_history (6 slots)
      exact_or_approximate: exact
      preserved_properties:
        - a missing index raises; nothing is substituted
        - the quiet reference (Ap = 4 in every slot) equals the model's geomagnetic switch-off
    assumptions:
      - GFZ observed (not adjusted) F10.7 is the model input, as the GFZ header recommends
    limitations:
      - the centred mean needs 40 days after the epoch; near real time it does not exist
    validation:
      - tests/physics/test_space_weather_conventions.py
    see_also:
      - SIDERA-MODEL-ATM-003
    notes: >-
      Closes the gap noted on SIDERA-MODEL-ATM-003 ("storm-time mode needs a
      3-hourly Ap history the provider may not have").

  - id: SIDERA-ALG-MAG-002
    slug: merging_electric_field
    canonical_name: >-
      Solar-wind merging (reconnection) electric field Em = v B_T sin^2(theta/2)
    category: physical_model
    domain: MAG
    status: active
    added: "2026-10-06"
    implementation_class: standard_implementation
    verification_status: verified_secondary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - Liu2010ThermosphereDensityEm
    primary_reference:
      type: article
      citation_key: Liu2010ThermosphereDensityEm
      identifier_kind: doi
      doi: 10.5194/angeo-28-1633-2010
      isbn: null
      report_number: null
      standard_number: null
      official_url: null
      edition: null
      chapter: null
      section: null
      equations: []
      pages: "1633-1649"
      verification_notes: >-
        The form v*B_T*sin^2(theta/2) in mV/m (v in km/s, B in nT, factor 1e-3)
        is taken from Liu et al. 2010, which attributes it to Kan and Lee 1979;
        the Kan and Lee original was not read in this project. Analytic limits
        are pinned in tests: purely southward IMF gives v|Bz|e-3, purely
        northward gives 0, dawn-dusk gives half. The saturated form
        s*Em/sqrt(s^2+Em^2) with s = 8 mV/m follows Liu et al. Eq. (4) as
        recorded in the module docstring (equation number from an earlier
        session's reading; re-check on merge day).
    symbols:
      - path: src/sidera/physics/space_environment/coupling.py
        symbol: merging_electric_field_mv_m
        role: cpu_implementation
      - path: src/sidera/physics/space_environment/coupling.py
        symbol: saturated_merging_field_mv_m
        role: cpu_implementation
    mathematical_contract:
      inputs: flow speed (km/s), By and Bz in GSM (nT)
      outputs: Em in mV/m (NaN propagates)
      exact_or_approximate: exact
      preserved_properties:
        - non-negative; zero for purely northward IMF
    assumptions:
      - GSM components; OMNI's bow-shock-nose time shift already applied
    limitations:
      - the (1 - Bz/B_T)/2 form cancels near northward IMF (relative error ~1e-11, measured)
    validation:
      - tests/physics/test_space_environment_coupling.py
    see_also: []
    notes: ""

