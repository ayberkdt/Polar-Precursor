      Y10 5 days, 81-day centred means with the same lags (SET SOLFSMY)
    category: standard
    domain: DATA
    status: active
    added: "2026-10-06"
    implementation_class: standard_implementation
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - SET2026SOLFSMY
    primary_reference:
      type: dataset
      citation_key: SET2026SOLFSMY
      identifier_kind: official_url
      doi: null
      isbn: null
      report_number: null
      standard_number: null
      official_url: https://sol.spacenvironment.net/JB2008/indices/SOLFSMY.TXT
      edition: null
      chapter: null
      section: "file header, release 8_1_0"
      equations: []
      pages: null
