      outputs: F10, F10B, S10, S10B, M10, M10B, Y10, Y10B for the epoch
      exact_or_approximate: exact
      preserved_properties:
        - a spline-filled or missing index (source flag 0) raises
    assumptions: []
    limitations:
      - no JB2008 atmosphere adapter exists yet; this is input preparation only
    validation:
      - tests/io/test_space_weather_set_jb2008.py
    see_also:
      - SIDERA-MODEL-ATM-003
    notes: ""
