  - id: SIDERA-ALG-MAG-004
    slug: exponential_memory_integral
    canonical_name: >-
      Exponentially weighted causal time integral of a solar-wind driver
      (Liu et al. 2010 time-weighted mean)
    category: numerical_algorithm
    domain: MAG
    status: active
    added: "2026-10-06"
    implementation_class: standard_implementation
    verification_status: pending_verification
    scientific_status: implemented_and_tested
    citation_keys:
      - Liu2010ThermosphereDensityEm
    primary_reference:
      type: article
      citation_key: Liu2010ThermosphereDensityEm
      identifier_kind: doi
      doi: 10.5194/angeo-28-1633-2010
      isbn: null
      report_number: null
      standard_number: null
      official_url: null
      edition: null
      chapter: null
      section: null
      equations:
        - "8"
      pages: "1633-1649"
      verification_notes: >-
        The equation number (8) and tau = 3 h come from an earlier session's
        notes; the PDF was not reopened in this project, so the status stays
        pending. The implementation is pinned independently: step response
        matches the closed form, a later sample never changes an earlier
        output (causality test), and output is withheld when less than half the
        full weight is present.
    symbols:
      - path: src/sidera/physics/space_environment/memory.py
        symbol: exponential_memory
        role: cpu_implementation
    mathematical_contract:
      inputs: regularly sampled series with NaN gaps, step and time constant in seconds
      outputs: causal weighted mean per sample
      exact_or_approximate: exact
      preserved_properties:
        - strictly causal
        - missing samples carry no weight
    assumptions: []
    limitations:
      - min_weight_fraction = 0.5 is this project's choice
    validation:
      - tests/physics/test_space_environment_memory.py
    see_also:
      - SIDERA-ALG-MAG-002
    notes: ""

  - id: SIDERA-ALG-MAG-005
    slug: storm_intensity_by_min_symh
    canonical_name: >-
      Geomagnetic storm intensity classes by minimum SYM-H (weak >= -50 nT,
      moderate [-100, -50), strong [-150, -100), severe [-250, -150), extreme < -250)
    category: standard
    domain: MAG
    status: active
    added: "2026-10-06"
    implementation_class: standard_implementation
    verification_status: verified_primary_source
    scientific_status: implemented_and_tested
    citation_keys:
      - OliveiraZesta2019SatelliteDragStorms
    primary_reference:
      type: article
      citation_key: OliveiraZesta2019SatelliteDragStorms
      identifier_kind: doi
      doi: 10.1029/2019SW002287
      isbn: null
      report_number: null
      standard_number: null
      official_url: https://arxiv.org/abs/1910.09622
      edition: null
      chapter: null
      section: null
      equations: []
      pages: null
      verification_notes: >-
        Boundaries and operators read 2026-10-05 from Table 1 of the arXiv
        version (1910.09622); the authors call the intervals arbitrary. The
        companion GRL paper (Zesta and Oliveira 2019, doi:10.1029/2019GL085120)
        uses strict inequalities on both sides. The journal DOI above is the
        Space Weather article's; the arXiv text is what was read.
    symbols:
      - path: src/sidera/physics/space_environment/storms.py
        symbol: classify_by_min_symh
        role: cpu_implementation
    mathematical_contract:
      inputs: minimum SYM-H of the event (nT)
      outputs: one of five classes
      exact_or_approximate: exact
      preserved_properties: []
    assumptions: []
    limitations:
      - class limits are a convention, not a physical threshold
    validation:
      - tests/physics/test_space_environment_storms.py
    see_also: []
    notes: ""

  - id: SIDERA-HEUR-MAG-001
    slug: main_phase_onset_rule
    canonical_name: >-
      Automatic storm zero-epoch: sharp southward turning of IMF Bz leading into
      the first interval at least 0.7 times the window's deepest Bz
    category: standard
    domain: MAG
    status: active
    added: "2026-10-06"
    implementation_class: heuristic
    verification_status: unverifiable
    scientific_status: experimental
    citation_keys: []
    primary_reference: null
    symbols:
      - path: src/sidera/physics/space_environment/storms.py
        symbol: find_main_phase_onset
        role: cpu_implementation
    mathematical_contract:
      inputs: 1-minute Bz (GSM) series, seed time (e.g. ICME disturbance time)
      outputs: onset time or a stated failure (no_turning, insufficient_data)
      exact_or_approximate: heuristic
      preserved_properties:
        - insufficient data is reported, never silently treated as no storm
    assumptions:
      - OMNI-style regular sampling with NaN gaps
    limitations:
      - relative depth 0.7 was chosen on five published onsets (calibration, not validation)
    validation:
      - tests/physics/test_space_environment_storms.py
    see_also:
      - SIDERA-ALG-MAG-005
    notes: >-
      Replaces the visual pick of Zesta and Oliveira (2019) with a stated rule;
      five events within 7 minutes of the published times (plans/kanit).

  - id: SIDERA-HEUR-MAG-002
    slug: solar_wind_shock_candidate_rule
    canonical_name: >-
      Interplanetary shock candidate: simultaneous rise of the 10-minute medians
      of flow speed (>= 40 km/s), |B| (>= 1.3x) and proton density (>= 1.3x)
    category: standard
    domain: MAG
    status: active
    added: "2026-10-06"
    implementation_class: heuristic
    verification_status: unverifiable
    scientific_status: experimental
    citation_keys: []
    primary_reference: null
    symbols:
      - path: src/sidera/physics/space_environment/shock.py
        symbol: detect_shocks
        role: cpu_implementation
    mathematical_contract:
      inputs: 1-minute OMNI frame (speed, |B|, density)
      outputs: candidate times with the minute at which each becomes known
      exact_or_approximate: heuristic
      preserved_properties:
        - a candidate is only usable as a forecast input after its confirmation time
    assumptions: []
    limitations:
      - thresholds tuned on four Richardson-Cane disturbances; misses events with plasma gaps
    validation:
      - tests/physics/test_space_environment_shock.py
    see_also: []
    notes: ""

  - id: SIDERA-DATA-ATM-001
